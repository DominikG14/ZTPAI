name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: room_booking
          POSTGRES_USER: room_booking
          POSTGRES_PASSWORD: room_booking_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U room_booking -d room_booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://room_booking:room_booking_dev@localhost:5432/room_booking_test
      DEV_DATABASE_URL: postgres://room_booking:room_booking_dev@localhost:5432/room_booking
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t room-booking-api:${{ github.sha }} .
