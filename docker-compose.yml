services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: room_booking
      POSTGRES_USER: room_booking
      POSTGRES_PASSWORD: room_booking_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room_booking -d room_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
